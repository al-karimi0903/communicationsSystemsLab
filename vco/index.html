
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCO Simulation</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f3f5f8;
    margin: 0;
    padding: 25px;
    color: #202938;
}
.container {
    max-width: 1100px;
    margin: auto;
}
.chart {
    background: white;
    padding: 12px;
    margin: 22px 0;
    border-radius: 12px;
}
a { color: #1769aa; }
</style>
</head>
<body>
<div class="container">

<a href="../">← Back to Home</a>

<h1>Voltage Controlled Oscillator (VCO)</h1>

<p>
Interactive MATLAB simulation of a Voltage Controlled Oscillator.
</p>

<div class="chart">
    <h3>Input Modulating Signal</h3>
    <div id="chart1"></div>
</div>

<div class="chart">
    <h3>Instantaneous Frequency</h3>
    <div id="chart2"></div>
</div>

<div class="chart">
    <h3>VCO Output Signal</h3>
    <div id="chart3"></div>
</div>

<script>
const layout = {
    autosize: true,
    margin: {l: 60, r: 25, t: 35, b: 55},
    xaxis: {title: "Time (s)"},
    yaxis: {title: "Amplitude"},
    hovermode: "closest"
};


async function loadVCOData() {
    const response = await fetch('./vco_data.csv');

    if (!response.ok) {
        throw new Error('Could not load VCO data');
    }

    const csv = await response.text();
    const rows = csv.trim().split(/\r?\n/);

    const data = rows.slice(1).map(row => {
        const values = row.split(',').map(Number);

        return {
            t: values[0],
            vin: values[1],
            fi: values[2],
            vout: values[3]
        };
    });

    const time = data.map(d => d.t);

    const config = {
        responsive: true,
        displaylogo: false,
        toImageButtonOptions: {
            format: 'png',
            filename: 'VCO_chart',
            scale: 2
        }
    };

    const commonLayout = {
        autosize: true,
        margin: { l: 65, r: 25, t: 35, b: 55 },
        xaxis: { title: 'Time (s)' },
        hovermode: 'closest'
    };

    Plotly.react('chart1', [{
        x: time,
        y: data.map(d => d.vin),
        type: 'scatter',
        mode: 'lines',
        name: 'Input'
    }], {
        ...commonLayout,
        yaxis: { title: 'Voltage (V)' }
    }, config);

    Plotly.react('chart2', [{
        x: time,
        y: data.map(d => d.fi),
        type: 'scatter',
        mode: 'lines',
        name: 'Frequency'
    }], {
        ...commonLayout,
        yaxis: { title: 'Frequency (Hz)' }
    }, config);

    Plotly.react('chart3', [{
        x: time,
        y: data.map(d => d.vout),
        type: 'scatter',
        mode: 'lines',
        name: 'VCO Output'
    }], {
        ...commonLayout,
        yaxis: { title: 'Amplitude' }
    }, config);
}

loadVCOData().catch(error => {
    document.querySelector('.container').insertAdjacentHTML(
        'beforeend',
        '<p>Data loading failed. Check the CSV file.</p>'
    );
    console.error(error);
});

</script>

</div>
</body>
</html>
